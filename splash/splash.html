<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymMatch — Loading Screen</title>
<style>
  :root { --ink:#1C1C1E; --mist:#8A8A8E; }
  * { margin:0; box-sizing:border-box; }
  body {
    min-height:100dvh; display:grid; place-items:center;
    background:#fff; color:var(--ink);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    text-align:center;
  }
  .mark { width:112px; height:auto; color:var(--ink);
    animation: pop .65s cubic-bezier(.2,.9,.3,1.35) both, float 2.8s .8s ease-in-out infinite alternate; }
  h1 { font-size:36px; letter-spacing:-1px; margin-top:20px;
    animation: fade .5s .25s both; }
  p { color:var(--mist); font-size:15px; margin-top:8px;
    animation: fade .5s .35s both; }
  .dots { display:flex; gap:9px; margin-top:56px; justify-content:center; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--ink); animation: pulse 1.15s ease-in-out infinite; }
  .dots i:nth-child(2){ animation-delay:.15s }
  .dots i:nth-child(3){ animation-delay:.3s }
  @keyframes pop { from { transform:scale(.55); opacity:0 } to { transform:scale(1); opacity:1 } }
  @keyframes float { from { transform:translateY(0) } to { transform:translateY(-9px) } }
  @keyframes pulse { 0%,100% { transform:scale(.7); opacity:.3 } 50% { transform:scale(1.15); opacity:1 } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .mark,.dots i,h1,p { animation:none } }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
    <rect x="2" y="15" width="11" height="34" rx="5.5"/>
    <rect x="51" y="15" width="11" height="34" rx="5.5"/>
    <rect x="15" y="21" width="5" height="22" rx="2.5"/>
    <rect x="44" y="21" width="5" height="22" rx="2.5"/>
    <rect x="19" y="29.5" width="26" height="5" rx="2.5"/>
    <path d="M19 31a13 13 0 0 1 26 0Z"/>
    <rect x="22" y="31" width="20" height="9" rx="4"/>
    <rect x="29" y="14.5" width="6" height="5" rx="2.5"/>
    <rect x="25" y="38" width="3" height="9" rx="1.5" transform="rotate(12 26.5 38)"/>
    <rect x="36" y="38" width="3" height="9" rx="1.5" transform="rotate(-12 37.5 38)"/>
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M24.5 13c1.6-2 .2-3.6 1.4-5.6"/>
      <path d="M39.5 13c-1.6-2-.2-3.6-1.4-5.6"/>
    </g>
    <path d="M20.5 31h23" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </svg>
  <h1>Barbe<span style="color:var(--mist)">Cue</span></h1>
  <p>Better Workouts. Better People.</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</body>
</html>
