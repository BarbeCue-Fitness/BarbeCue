<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BarbeCue mark — loaded barbell whose center weight is a kettle barbecue">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>
  <!-- loaded plates: two per side -->
  <g fill="currentColor">
    <rect x="2" y="15" width="11" height="34" rx="5.5"/>
    <rect x="51" y="15" width="11" height="34" rx="5.5"/>
    <rect x="15" y="21" width="5" height="22" rx="2.5"/>
    <rect x="44" y="21" width="5" height="22" rx="2.5"/>
    <!-- bar -->
    <rect x="19" y="29.5" width="26" height="5" rx="2.5"/>
    <!-- grill body -->
    <rect x="22" y="31" width="20" height="9" rx="4"/>
    <!-- grill feet -->
    <rect x="25" y="38" width="3" height="9" rx="1.5" transform="rotate(12 26.5 38)"/>
    <rect x="36" y="38" width="3" height="9" rx="1.5" transform="rotate(-12 37.5 38)"/>
  </g>
  <!-- kettle grill lid = center weight, glowing ember -->
  <path d="M19 31a13 13 0 0 1 26 0Z" fill="url(#ember)"/>
  <!-- vent knob -->
  <rect x="29" y="14.5" width="6" height="5" rx="2.5" fill="url(#ember)"/>
  <!-- smoke curls -->
  <g fill="none" stroke="#FF5A1F" stroke-width="2.2" stroke-linecap="round">
    <path d="M24.5 13c1.6-2 .2-3.6 1.4-5.6"/>
    <path d="M39.5 13c-1.6-2-.2-3.6-1.4-5.6"/>
  </g>
  <!-- lid seam (cutout) -->
  <path d="M20.5 31h23" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>
